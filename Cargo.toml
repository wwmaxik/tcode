[package]
name = "tcode"
version = "0.0.1-beta"
edition = "2024"
license = "GPL-3.0"
description = "A professional-grade TUI code editor with an integrated AI agent, LSP support, and terminal."
repository = "https://github.com/yourusername/tcode"
keywords = ["editor", "tui", "rust", "ai", "agent", "lsp"]
categories = ["development-tools::editors"]

[dependencies]
arboard = "3.6.1"
crossterm = "0.29.0"
git2 = "0.20.4"
lsp-types = "0.97.0"
notify = "8.2.0"
nucleo = "0.5.0"
portable-pty = "0.9.0"
ratatui = "0.30.0"
rhai = "1.24.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
similar = "3.1.0"
syntect = "5.3.0"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "io-util", "sync", "time", "process", "full"] }
toml = "1.1.2"
url = "2.5.8"
reqwest = { version = "0.12", features = ["stream", "rustls-tls", "json"], default-features = false }
futures-util = "0.3"
vte = "0.15.0"
