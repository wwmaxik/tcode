name: Bug Report
description: Report a bug to help us improve tcode
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: bug-description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating System
      description: What OS are you using? (e.g. Ubuntu 22.04, macOS Sonoma)
  - type: input
    id: terminal
    attributes:
      label: Terminal Emulator
      description: Which terminal are you using? (e.g. Alacritty, iTerm2, Kitty)
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How did you encounter this bug?
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
